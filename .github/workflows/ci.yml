name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline from scratch
      run: python run_pipeline.py

    - name: Verify reproducibility (SHA-256 Check across 3 Runs)
      run: python scripts/verify_reproducibility.py

    - name: Run automated tests
      run: python -m pytest tests/

    - name: Run regression evaluation suite
      run: python evals/eval_suite.py

    - name: Run synthetic injection test
      run: python evals/synthetic_eval.py

    - name: Run retrieval benchmark
      run: python evals/evaluate_retrieval.py
